server:
  port: ${SERVER_PORT:8082}
spring:
  datasource:
    url: ${ORACLE_JDBC_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${ORACLE_USERNAME:FORUM_SERVICE}
    password: ${ORACLE_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
users-service:
  url: ${USERS_SERVICE_URL:http://users-service:8081}
