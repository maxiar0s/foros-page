services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYSTEM_PASSWORD:-LocalOnly-ChangeMe-123!}
      APP_USER: ${ORACLE_APP_USER:-FORUM_APP}
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD:-LocalOnly-ChangeMe-456!}
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./database/container-init:/container-entrypoint-initdb.d:ro
      - ./database/init/01-forum-schema-and-seed.sql:/opt/forum/01-forum-schema-and-seed.sql:ro
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  users-service:
    build:
      context: ./users-service
    environment:
      SERVER_PORT: 8081
      ORACLE_JDBC_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      ORACLE_USERNAME: ${ORACLE_APP_USER:-FORUM_APP}
      ORACLE_PASSWORD: ${ORACLE_APP_PASSWORD:-LocalOnly-ChangeMe-456!}
      DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET:-bG9jYWwtZGVtby1qd3Qtc2VjcmV0LW9ubHktMzItYnl0ZXM=}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-PT1H}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-25}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-noreply@example.test}
      RECOVERY_FRONTEND_URL: ${RECOVERY_FRONTEND_URL:-http://localhost:4200}
    ports:
      - "${USERS_PORT:-8081}:8081"
    depends_on:
      oracle:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s

  forum-service:
    build:
      context: ./forum-service
    environment:
      SERVER_PORT: 8082
      ORACLE_JDBC_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      ORACLE_USERNAME: ${ORACLE_APP_USER:-FORUM_APP}
      ORACLE_PASSWORD: ${ORACLE_APP_PASSWORD:-LocalOnly-ChangeMe-456!}
      DDL_AUTO: validate
      USERS_SERVICE_URL: http://users-service:8081
    ports:
      - "${FORUM_PORT:-8082}:8082"
    depends_on:
      oracle:
        condition: service_healthy
      users-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8082'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s

  moderation-service:
    build:
      context: ./moderation-service
    environment:
      SERVER_PORT: 8083
      USERS_SERVICE_URL: http://users-service:8081
      FORUM_SERVICE_URL: http://forum-service:8082
    depends_on:
      users-service:
        condition: service_healthy
      forum-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8083'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      users-service:
        condition: service_healthy
      forum-service:
        condition: service_healthy
      moderation-service:
        condition: service_healthy

volumes:
  oracle-data:
    name: foro-oracle-data
